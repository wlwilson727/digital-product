name: Validate local products
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: make test
      - run: python3 product-factory/factory.py build
      - run: python3 product-factory/factory.py verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-quality-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unpublished-product-candidates
          path: releases/
